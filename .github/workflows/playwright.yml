name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Smoke and regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify test credentials are configured
        env:
          ECOM_USERNAME: ${{ secrets.ECOM_USERNAME }}
          ECOM_PASSWORD: ${{ secrets.ECOM_PASSWORD }}
        run: |
          test -n "$ECOM_USERNAME" || { echo "Missing repository secret: ECOM_USERNAME"; exit 1; }
          test -n "$ECOM_PASSWORD" || { echo "Missing repository secret: ECOM_PASSWORD"; exit 1; }

      - name: Run smoke and regression tests
        run: npx playwright test --grep '@smoke|@regression'
        env:
          ECOM_BASE_URL: ${{ vars.ECOM_BASE_URL || 'https://rahulshettyacademy.com' }}
          ECOM_USERNAME: ${{ secrets.ECOM_USERNAME }}
          ECOM_PASSWORD: ${{ secrets.ECOM_PASSWORD }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
